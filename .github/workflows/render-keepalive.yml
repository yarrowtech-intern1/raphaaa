name: Keep Render Backend Awake

on:
  schedule:
    # GitHub Actions minimum reliable interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Validate health URL secret
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_HEALTHCHECK_URL }}" ]; then
            echo "RENDER_BACKEND_HEALTHCHECK_URL is missing."
            exit 1
          fi

      - name: Ping backend
        run: |
          echo "Pinging: ${{ secrets.RENDER_BACKEND_HEALTHCHECK_URL }}"
          curl -fsS --max-time 20 --retry 2 --retry-delay 2 "${{ secrets.RENDER_BACKEND_HEALTHCHECK_URL }}" > /dev/null
          echo "Ping success"
